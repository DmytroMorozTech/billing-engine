# Local development infrastructure.

services:
  # Runs once and exits. Migrations deliberately do not happen on API startup:
  # two instances booting together would race for the same schema, and a
  # rolled-back deploy must not quietly take the schema with it.
  #
  # Same image as the API, so the schema applied is the one that image's code
  # was built against.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: billing-api
    command: ['node', 'packages/db/dist/cli.js', 'up']
    environment:
      DATABASE_URL: postgres://billing:billing@postgres:5432/billing
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: billing-api
    container_name: billing-api
    environment:
      # The internal port, not the published one: inside the compose network
      # postgres answers on 5432 regardless of where it is published outside.
      DATABASE_URL: postgres://billing:billing@postgres:5432/billing
      PORT: 8080
    ports:
      - '${API_PORT:-8081}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The payment provider we do not own, standing in for itself. Deliberately
  # has no database and no volume: it keeps no state, so a restart cannot make
  # a demo behave differently than it did a minute ago.
  psp:
    build:
      context: ./apps/psp
    image: billing-psp
    container_name: billing-psp
    environment:
      PSP_PORT: 8082
    ports:
      - '${PSP_PORT:-8082}:8082'
    restart: unless-stopped

  # Fills an empty database with the demo, then exits. Runs on every `up` and
  # does nothing when the database already has merchants, so it is safe to
  # leave here: the alternative is a step people forget before a demo.
  seed:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: billing-worker
    command: ['node', 'apps/worker/dist/seed-main.js']
    environment:
      DATABASE_URL: postgres://billing:billing@postgres:5432/billing
      PSP_URL: http://psp:8082
    depends_on:
      psp:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  # Publishes the outbox. Its own image rather than a second role for the API
  # image: the two scale for different reasons and fail in different ways.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: billing-worker
    container_name: billing-worker
    environment:
      DATABASE_URL: postgres://billing:billing@postgres:5432/billing
      REDIS_URL: redis://redis:6379
      PSP_URL: http://psp:8082
      OUTBOX_POLL_INTERVAL_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      psp:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: billing-postgres
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
      # Deterministic collation: sort order affects index behaviour, and a
      # locale difference between a developer machine and CI is a genuinely
      # unpleasant bug to track down.
      LANG: C
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    # Published on 5433, not 5432. A developer machine very often already runs
    # a PostgreSQL install on the default port, and on Windows both it and the
    # Docker proxy will happily bind 5432 at once — connections then land on
    # whichever won, and the failure looks like a password problem rather than
    # a port collision. Moving the published port removes the ambiguity.
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billing -d billing']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: billing-redis
    # appendonly keeps queued jobs across a restart. Redis is still not the
    # source of truth for anything that moves money — see ADR-0004.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:

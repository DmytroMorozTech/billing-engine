name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repository. Without this the
# workflow inherits the repository default, which is often contents: write —
# a write-capable token handed to a job that just runs a linter.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

  # The simulator is Go and is not an npm workspace (ADR-0007), so it gets its
  # own job rather than being smuggled into the backend one.
  psp:
    name: PSP
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/psp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: apps/psp/go.mod

      - name: Formatting
        # gofmt does not fail on its own; it just prints what it would change.
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  integration:
    name: Integration
    runs-on: ubuntu-24.04

    # The constraints under test live in the database — an exclusion constraint
    # on rate intervals, a deferred trigger that refuses an unbalanced ledger
    # transfer, append-only entries. Asserting them in TypeScript would only
    # prove the TypeScript is consistent with itself.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing -d billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The outbox transport. Its tests skip themselves when REDIS_URL is
      # absent, which is exactly how a transport test stops being run at all —
      # so CI provides one rather than relying on a developer having Docker up.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://billing:billing@localhost:5432/billing
      REDIS_URL: redis://localhost:6379
      PSP_URL: http://localhost:8082

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built here rather than declared as a service: the simulator is this
      # repository's own image and is not published anywhere. Without it the
      # payment client tests skip themselves, which is how a test at a service
      # boundary quietly stops running.
      - name: Start the payment simulator
        run: |
          docker build -t billing-psp apps/psp
          docker run -d --name psp -p 8082:8082 billing-psp

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Migrate
        run: node packages/db/dist/cli.js up

      - name: Test
        run: npm run test

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # apps/web keeps the Circuit UI template's own toolchain, so it is linted
      # and tested by its own scripts rather than the root ones. See ADR-0007.
      - name: Lint
        run: npm run lint --workspace @billing/web

      - name: Lint CSS
        run: npm run lint:css --workspace @billing/web

      - name: Test
        run: npm run test:ci --workspace @billing/web

      - name: Build
        run: npm run build --workspace @billing/web

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Every package in the tree must carry a valid npm registry signature.
      # This is the check that would catch a tampered or unsigned dependency
      # appearing in the lockfile. See ADR-0008.
      - name: Verify registry signatures
        run: npm audit signatures

      # Advisories are reported but do not fail the build: the one known issue
      # is a stack-exhaustion bug in a dev-only dependency of the frontend
      # toolchain, which never reaches a production bundle. Revisit if a
      # runtime dependency is ever affected.
      - name: Audit
        run: npm audit --audit-level=high || true
